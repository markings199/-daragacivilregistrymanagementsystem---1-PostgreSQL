{% from 'print/_cert_macros.html' import cert_row %}
<div class="cert-sheet cert-sheet--{{ doc_type|default('birth') }}">
  <div class="cert-form-id">
    Civil Registry Form No. {{ meta.form_no }}<br>
    <span>{{ meta.availability }}</span>
  </div>

  <div class="cert-head-block">
    <img
      class="cert-seal"
      src="{{ url_for('static', filename='mcr-daraga-seal.png') }}"
      alt="Municipal Civil Registry — Daraga seal"
    />
    <p class="cert-republic">Republic of the Philippines</p>
    <p class="cert-office">OFFICE OF THE MUNICIPAL CIVIL REGISTRAR</p>
    <p class="cert-municipality">Daraga (Locsin), Albay</p>
  </div>

  <p class="cert-date-line">
    <span class="cert-date-value">{{ cert_date }}</span>
  </p>

  <p class="cert-salutation">TO WHOM IT MAY CONCERN:</p>
  <p class="cert-intro">{{ meta.intro | safe }}</p>
